name: Build and Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: harbor.zkjgy.online
  IMAGE_NAME: harbor.zkjgy.online/library/kubeedge-dashboard
  CHART_REGISTRY: harbor.zkjgy.online/charts

jobs:
  # 并行：原生 runner 构建各架构镜像，推送 -<arch> 标签，同时导出离线 tar
  build-arch:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # 拉取刚才推送的单架构镜像并导出为离线 tar 包
      - name: Export offline image
        run: |
          IMG="${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}"
          docker pull "$IMG"
          docker tag "$IMG" "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker save "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            | gzip > /tmp/kubeedge-dashboard-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/kubeedge-dashboard-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # 合并多架构 manifest：把 -amd64 / -arm64 合成 :latest 与 :<version>
  merge-manifest:
    name: Merge Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: build-arch
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Create and push manifest
        run: |
          VERSION="${{ needs.build-arch.outputs.version }}"
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${VERSION} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            ${{ env.IMAGE_NAME }}:${VERSION}-arm64

  # 打包 Helm Chart 并推送到 Harbor OCI 仓库
  package-helm:
    name: Package & Push Helm Chart
    runs-on: ubuntu-latest
    needs: build-arch
    outputs:
      chart_version: ${{ steps.chart.outputs.chart_version }}
      chart_file: ${{ steps.chart.outputs.chart_file }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Update Chart version
        id: chart
        run: |
          VERSION="${{ needs.build-arch.outputs.version }}"
          CHART_VERSION="${VERSION#v}"
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" charts/kubeedge-dashboard/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/kubeedge-dashboard/Chart.yaml
          sed -i "s|^\(\s*tag:\).*|\1 \"${VERSION}\"|" charts/kubeedge-dashboard/values.yaml
          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "chart_file=kubeedge-dashboard-${CHART_VERSION}.tgz" >> $GITHUB_OUTPUT

      - name: Package Helm Chart
        run: |
          mkdir -p /tmp/helm-output
          helm package charts/kubeedge-dashboard --destination /tmp/helm-output

      - name: Push to Harbor OCI
        run: |
          helm registry login ${{ env.REGISTRY }} \
            --username '${{ secrets.HARBOR_USERNAME }}' \
            --password '${{ secrets.HARBOR_PASSWORD }}'
          helm push /tmp/helm-output/*.tgz oci://${{ env.CHART_REGISTRY }}

      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: /tmp/helm-output/*.tgz
          retention-days: 1

  # 创建 GitHub Release，附带离线镜像包和 Helm Chart 包
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-arch, merge-manifest, package-helm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image-amd64
          path: /tmp/release-assets/

      - uses: actions/download-artifact@v4
        with:
          name: image-arm64
          path: /tmp/release-assets/

      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: /tmp/release-assets/

      - name: Generate release notes
        run: |
          VERSION="${{ needs.build-arch.outputs.version }}"
          CHART_VERSION="${{ needs.package-helm.outputs.chart_version }}"
          CHART_FILE="${{ needs.package-helm.outputs.chart_file }}"
          cat > /tmp/release-notes.md << EOF
          ## KubeEdge Dashboard ${VERSION}

          ### 容器镜像（多架构，已推送至 Harbor）

          \`\`\`
          ${{ env.IMAGE_NAME }}:${VERSION}
          ${{ env.IMAGE_NAME }}:latest
          \`\`\`

          支持架构：\`linux/amd64\`、\`linux/arm64\`

          ### Helm Chart（已推送至 Harbor OCI 仓库）

          \`\`\`bash
          helm install kubeedge-dashboard \\
            oci://${{ env.CHART_REGISTRY }}/kubeedge-dashboard \\
            --version ${CHART_VERSION} \\
            --create-namespace -n kubeedge-dashboard
          \`\`\`

          ---

          ### 离线部署

          **1. 下载本 Release 的资源文件**
          - \`kubeedge-dashboard-amd64.tar.gz\` / \`kubeedge-dashboard-arm64.tar.gz\`（离线镜像）
          - \`${CHART_FILE}\`（离线 Helm Chart）

          **2. 导入镜像到离线服务器**
          \`\`\`bash
          # AMD64 节点
          gunzip -c kubeedge-dashboard-amd64.tar.gz | docker load
          # ARM64 节点
          gunzip -c kubeedge-dashboard-arm64.tar.gz | docker load
          \`\`\`

          > 若使用 containerd / k3s，可改用 \`ctr -n=k8s.io images import\` 或 \`k3s ctr images import\` 导入。

          **3. 离线安装 Helm Chart**
          \`\`\`bash
          helm install kubeedge-dashboard ${CHART_FILE} \\
            --create-namespace -n kubeedge-dashboard
          \`\`\`

          安装完成后访问：\`http://<节点 IP>:30080\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "KubeEdge Dashboard ${{ needs.build-arch.outputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            /tmp/release-assets/kubeedge-dashboard-amd64.tar.gz
            /tmp/release-assets/kubeedge-dashboard-arm64.tar.gz
            /tmp/release-assets/*.tgz
