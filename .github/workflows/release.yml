name: Build and Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: harbor.zkjgy.online
  IMAGE_NAME: harbor.zkjgy.online/library/kubeedge-dashboard
  CHART_REGISTRY: harbor.zkjgy.online/charts

jobs:
  build-push-image:
    name: Build & Push Multi-arch Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  save-offline-images:
    name: Save Offline Image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: build-push-image
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build single-arch image for offline export
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ needs.build-push-image.outputs.version }}
          outputs: type=docker,dest=/tmp/kubeedge-dashboard-${{ matrix.arch }}.tar

      - name: Compress tarball
        run: gzip /tmp/kubeedge-dashboard-${{ matrix.arch }}.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/kubeedge-dashboard-${{ matrix.arch }}.tar.gz
          retention-days: 1

  package-helm:
    name: Package & Push Helm Chart
    runs-on: ubuntu-latest
    needs: build-push-image
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Update Chart version
        run: |
          VERSION=${{ needs.build-push-image.outputs.version }}
          CHART_VERSION=${VERSION#v}
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" charts/kubeedge-dashboard/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/kubeedge-dashboard/Chart.yaml

      - name: Package Helm Chart
        run: helm package charts/kubeedge-dashboard --destination /tmp/helm-output

      - name: Push to Harbor OCI
        run: |
          helm registry login ${{ env.REGISTRY }} \
            --username ${{ secrets.HARBOR_USERNAME }} \
            --password ${{ secrets.HARBOR_PASSWORD }}
          helm push /tmp/helm-output/*.tgz oci://${{ env.CHART_REGISTRY }}

      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: /tmp/helm-output/*.tgz
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-push-image, save-offline-images, package-helm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image-amd64
          path: /tmp/release-assets/

      - uses: actions/download-artifact@v4
        with:
          name: image-arm64
          path: /tmp/release-assets/

      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: /tmp/release-assets/

      - name: Generate release notes
        run: |
          VERSION=${{ needs.build-push-image.outputs.version }}
          CHART_VERSION=${VERSION#v}
          cat > /tmp/release-notes.md << EOF
          ## KubeEdge Dashboard ${VERSION}

          ### 容器镜像（已推送至 Harbor）

          | 架构 | 镜像 |
          |------|------|
          | amd64 / arm64 | \`harbor.zkjgy.online/library/kubeedge-dashboard:${VERSION}\` |

          ### Helm 部署（在线）

          \`\`\`bash
          helm install kubeedge-dashboard \\
            oci://harbor.zkjgy.online/charts/kubeedge-dashboard \\
            --version ${CHART_VERSION} --create-namespace -n kubeedge-dashboard
          \`\`\`

          ### 离线部署步骤

          **1. 导入镜像**
          \`\`\`bash
          # amd64
          docker load -i kubeedge-dashboard-amd64.tar.gz
          # arm64
          docker load -i kubeedge-dashboard-arm64.tar.gz
          \`\`\`

          **2. 离线安装 Helm Chart**
          \`\`\`bash
          helm install kubeedge-dashboard kubeedge-dashboard-${CHART_VERSION}.tgz \\
            --set image.tag=${VERSION} --create-namespace -n kubeedge-dashboard
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "KubeEdge Dashboard ${{ needs.build-push-image.outputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            /tmp/release-assets/kubeedge-dashboard-amd64.tar.gz
            /tmp/release-assets/kubeedge-dashboard-arm64.tar.gz
            /tmp/release-assets/*.tgz
