apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeedge-dashboard.fullname" . }}-web
  namespace: {{ include "kubeedge-dashboard.namespace" . }}
  labels:
    {{- include "kubeedge-dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webService.type }}
  selector:
    {{- include "kubeedge-dashboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: web
      port: {{ .Values.webService.port }}
      targetPort: 3000
      protocol: TCP
      {{- if and (eq .Values.webService.type "NodePort") .Values.webService.nodePort }}
      nodePort: {{ .Values.webService.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeedge-dashboard.fullname" . }}-api
  namespace: {{ include "kubeedge-dashboard.namespace" . }}
  labels:
    {{- include "kubeedge-dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.apiService.type }}
  selector:
    {{- include "kubeedge-dashboard.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.apiService.port }}
      targetPort: 8080
      protocol: TCP
