apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeedge-dashboard.fullname" . }}-config
  namespace: {{ include "kubeedge-dashboard.namespace" . }}
  labels:
    {{- include "kubeedge-dashboard.labels" . | nindent 4 }}
data:
  API_SERVER_HOST: {{ .Values.config.apiServerHost | quote }}
  API_SERVER_SKIP_TLS_VERIFY: {{ .Values.config.apiServerSkipTlsVerify | quote }}
  INSECURE_BIND_ADDRESS: {{ .Values.config.insecureBindAddress | quote }}
  INSECURE_PORT: {{ .Values.config.insecurePort | quote }}
