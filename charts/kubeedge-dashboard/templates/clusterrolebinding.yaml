apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeedge-dashboard.fullname" . }}
  labels:
    {{- include "kubeedge-dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeedge-dashboard.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeedge-dashboard.serviceAccountName" . }}
    namespace: {{ include "kubeedge-dashboard.namespace" . }}
