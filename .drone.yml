        path: /var/run/docker.sock
    branches:
      - main
  
  # 推送到 Harbor ARM
  - name: push-harbor-arm64
    image: docker
    environment:
      HARBOR_USERNAME:
        from_secret: harbor_username
      HARBOR_PASSWORD:
        from_secret: harbor_password
    commands:
      - echo "🔐 [ARM64] 登录 Harbor ARM 仓库..."
      - echo $HARBOR_PASSWORD | docker login harborarm.zkjgy.online --username $HARBOR_USERNAME --password-stdin
      - echo "📤 [ARM64] 推送镜像到 Harbor..."
      - docker push harborarm.zkjgy.online/library/kubeedge-dashboard:latest
